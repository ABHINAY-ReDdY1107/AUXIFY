<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="12" fill="#1A1814"/>
  <rect x="40" y="40" width="320" height="220" rx="8" fill="#2D2A24" stroke="#8B7340" stroke-width="0.5"/>
  
  <!-- Bill / Invoice Paper -->
  <rect x="140" y="70" width="120" height="140" fill="#C4A96D" opacity="0.1" stroke="#C4A96D" stroke-width="1.5" rx="4"/>
  
  <!-- Lines on the bill -->
  <line x1="160" y1="95" x2="240" y2="95" stroke="#C4A96D" stroke-width="2" opacity="0.8"/>
  <line x1="160" y1="115" x2="240" y2="115" stroke="#C4A96D" stroke-width="2" opacity="0.8"/>
  <line x1="160" y1="135" x2="210" y2="135" stroke="#C4A96D" stroke-width="2" opacity="0.8"/>
  
  <!-- Total section on bill -->
  <line x1="150" y1="170" x2="250" y2="170" stroke="#C4A96D" stroke-width="1" stroke-dasharray="4" opacity="0.6"/>
  <rect x="190" y="180" width="50" height="10" fill="#C4A96D" opacity="0.8" rx="2"/>

  <!-- Currency / Calculator icon overlay -->
  <circle cx="250" cy="180" r="18" fill="#1A1814" stroke="#C4A96D" stroke-width="1.5"/>
  <text x="250" y="185" text-anchor="middle" fill="#C4A96D" font-family="sans-serif" font-size="14" font-weight="bold">$</text>

  <!-- Label -->
  <text x="200" y="230" text-anchor="middle" fill="#C4A96D" font-family="sans-serif" font-size="11" letter-spacing="0.15em" opacity="0.6">BILL GENERATOR</text>
  <!-- Subtitle -->
  <text x="200" y="248" text-anchor="middle" fill="#6B6560" font-family="sans-serif" font-size="9" letter-spacing="0.1em">DIGITAL INVOICING</text>
</svg>
